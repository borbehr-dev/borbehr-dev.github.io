# Единый конфиг сайта borbehr.eu.org.
# Здесь меняются название, контакты, проекты и временные объявления.
# Аудио добавляется простым копированием файлов в public/audio/.

site:
  title: "borBeHR — portfolio"
  name: "borBeHR"
  url: "https://borbehr.eu.org"
  description: "Независимый звук, код и цифровые эксперименты. Треки, проекты и контакт borBeHR."
  locale: "ru_RU"
  telegram_link: "https://t.me/venbehr"
  telegram_handle: "@venbehr"
  github_user: "borbehr-dev"

  notice:
    title: "Все Telegram-каналы удалены."
    text: "Связь — только @venbehr."

# Если projects пуст — при сборке сайт подтянет публичные репозитории GitHub.
# Если GitHub недоступен, используется встроенный снимок реальных проектов.
projects: []

# Закрываемые объявления вверху сайта.
# Ключ (1, 2, ...) — это id баннера, по нему он запоминается закрытым в localStorage.
# link необязателен.
alerts:
  1:
    text: "Вышел новый проект! Обязательно посмотрите!"
    link: "https://github.com/borbehr-dev/vibe-bio"
  2:
    text: "Демо vibe-bio"
    link: "https://borbehr-vibebio.pages.dev"
